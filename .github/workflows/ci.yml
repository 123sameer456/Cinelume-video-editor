name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install backend
        run: python -m pip install -e "backend[asr,dev]"

      - name: Lint
        run: python -m ruff check backend

      - name: Tests
        run: python -m pytest -q --tb=short
        working-directory: backend
        env:
          CINELUME_SLOW: ""

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
